<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Flags Matrix</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1>Feature Flags Matrix</h1>
    <p class="subtitle">Read-only view generated from the central feature flag configuration.</p>

    <div id="status">Loading...</div>

    <table id="flags-table" hidden>
      <thead>
        <tr>
          <th>ERP</th>
          <th>Bank</th>
          <th>Payments</th>
          <th>Clients</th>
          <th>Advisors</th>
        </tr>
      </thead>
      <tbody id="flags-body"></tbody>
    </table>
  </main>

  <script src="./app.js"></script>
</body>
</html>
